<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>سفر در زمان ⏳</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0f0c29;
    --bg2: #302b63;
    --bg3: #24243e;
    --accent: #00e5ff;
    --text: #ffffff;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Vazirmatn', sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    background-size: 300% 300%;
    animation: bgShift 18s ease infinite;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-x: hidden;
    transition: background 1.2s ease;
  }

  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ---------- تم‌های دوره‌های زمانی ---------- */
  body.theme-present { --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e; --accent:#00e5ff; }
  body.theme-past    { --bg1:#2b1a0f; --bg2:#5c3a1e; --bg3:#1a1208; --accent:#ffb347; }
  body.theme-future  { --bg1:#12002b; --bg2:#3d0066; --bg3:#06121f; --accent:#ff2fd0; }

  /* ---------- کارت اصلی ---------- */
  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 480px;
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 28px 22px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    animation: cardIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(18px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .title {
    font-size: 1.35rem;
    font-weight: 900;
    text-align: center;
    margin: 0 0 6px;
    color: var(--accent);
    text-shadow: 0 0 18px var(--accent);
    transition: color 0.6s ease;
  }

  .divider {
    height: 2px;
    width: 70px;
    margin: 0 auto 18px;
    border-radius: 2px;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    transition: background 0.6s ease;
  }

  .story {
    font-size: 1.02rem;
    line-height: 1.9;
    text-align: center;
    min-height: 84px;
    margin-bottom: 22px;
    opacity: 0.95;
  }

  /* ---------- دکمه‌ها ---------- */
  .choices { display: flex; flex-direction: column; gap: 12px; }

  .choice-btn {
    width: 100%;
    padding: 15px 18px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
    border: 1.5px solid var(--accent);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .choice-btn:active {
    transform: scale(0.97);
    background: var(--accent);
    color: #06121f;
    box-shadow: 0 0 22px var(--accent);
  }

  /* ---------- صفحه لودینگ / پورتال ---------- */
  #loader {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    background: radial-gradient(circle at center, #1b1440 0%, #05030f 75%);
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }

  #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  /* گرداب زمان */
  .portal {
    position: relative;
    width: 150px;
    height: 150px;
  }

  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: #00e5ff;
    border-right-color: #ff2fd0;
    animation: spin 1.4s linear infinite;
  }

  .ring:nth-child(2) {
    inset: 16px;
    border-top-color: #ffb347;
    border-right-color: #00e5ff;
    animation-duration: 1s;
    animation-direction: reverse;
  }

  .ring:nth-child(3) {
    inset: 32px;
    border-top-color: #ff2fd0;
    border-right-color: #ffffff;
    animation-duration: 0.7s;
  }

  .core {
    position: absolute;
    inset: 52px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, #00e5ff 40%, transparent 75%);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { transform: scale(0.85); opacity: 0.75; }
    50%      { transform: scale(1.15); opacity: 1; }
  }

  .loader-text {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-align: center;
    padding: 0 24px;
    color: #d9e6ff;
    animation: textFade 2.2s ease-in-out infinite;
  }

  @keyframes textFade {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }

  .dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }

  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
  }
</style>
</head>
<body class="theme-present">

<!-- ===== صفحه لودینگ ===== -->
<div id="loader">
  <div class="portal">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="core"></div>
  </div>
  <div class="loader-text" id="loaderText">در حال روشن کردن ماشین زمان<span class="dots"></span></div>
</div>

<!-- ===== کارت بازی ===== -->
<div class="card" id="card" style="display:none;">
  <h1 class="title" id="title">...</h1>
  <div class="divider"></div>
  <p class="story" id="story">...</p>
  <div class="choices" id="choices"></div>
</div>

<script>
  const loader      = document.getElementById('loader');
  const loaderText  = document.getElementById('loaderText');
  const card        = document.getElementById('card');
  const titleEl     = document.getElementById('title');
  const storyEl     = document.getElementById('story');
  const choicesEl   = document.getElementById('choices');

  // جمله‌های بامزه لودینگ
  const travelLines = [
    'در حال پرش به دوره‌ی زمانی بعدی<span class="dots"></span>',
    'ماشین زمان داره شارژ می‌شه<span class="dots"></span>',
    'داریم از پیچ‌وتاب زمان رد می‌شیم<span class="dots"></span>',
    'مولکول‌هات دارن جابه‌جا می‌شن<span class="dots"></span>',
    'کمی صبر کن، تاریخ در حال بازنویسیه<span class="dots"></span>'
  ];

  function showLoader(text) {
    loaderText.innerHTML = text;
    loader.classList.remove('hidden');
    card.style.display = 'none';
  }

  function hideLoader() {
    loader.classList.add('hidden');
    card.style.display = 'block';
    // ری‌استارت انیمیشن ورود کارت
    card.style.animation = 'none';
    void card.offsetWidth;
    card.style.animation = '';
  }

  function setTheme(theme) {
    document.body.className = 'theme-' + (theme || 'present');
  }

  function renderStep(data) {
    setTheme(data.theme);
    titleEl.textContent = data.title;
    storyEl.textContent = data.text;

    choicesEl.innerHTML = '';
    data.choices.forEach(choice => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = choice.text;
      btn.addEventListener('click', () => goTo(choice.next));
      choicesEl.appendChild(btn);
    });
  }

  async function goTo(stepId) {
    // نمایش لودینگ سفر
    const randomLine = travelLines[Math.floor(Math.random() * travelLines.length)];
    showLoader(randomLine);

    const minDelay = new Promise(r => setTimeout(r, 1400)); // حداقل زمان لودینگ برای حس سفر

    try {
      const res = await fetch('/api/step', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ step: stepId })
      });
      const data = await res.json();
      await minDelay;
      renderStep(data);
      hideLoader();
    } catch (err) {
      await minDelay;
      loaderText.innerHTML = '⚠️ اتصال به ماشین زمان قطع شد. دوباره تلاش کن<span class="dots"></span>';
      setTimeout(() => goTo(stepId), 2000);
    }
  }

  // بوت اولیه: بیدار کردن سرور با تلاش مجدد
  async function boot() {
    showLoader('در حال روشن کردن ماشین زمان<span class="dots"></span>');

    const startTime = Date.now();
    let attempt = 0;

    while (true) {
      attempt++;
      try {
        const res = await fetch('/api/step', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ step: 'start' })
        });
        if (!res.ok) throw new Error('bad status');
        const data = await res.json();

        // حداقل ۱.۵ ثانیه لودینگ برای زیبایی
        const elapsed = Date.now() - startTime;
        if (elapsed < 1500) await new Promise(r => setTimeout(r, 1500 - elapsed));

        renderStep(data);
        hideLoader();
        return;
      } catch (err) {
        // اگر سرور خواب بود، جمله‌های بامزه عوض می‌شن و دوباره تلاش می‌کنیم
        const waitingLines = [
          'سرور داره بیدار می‌شه، چند لحظه صبر کن<span class="dots"></span>',
          'ماشین زمان داره از خواب بیدار می‌شه<span class="dots"></span>',
          'اولین سفر همیشه کمی طول می‌کشه<span class="dots"></span>',
          'داریم چرخ‌دنده‌های زمان رو روغن‌کاری می‌کنیم<span class="dots"></span>'
        ];
        loaderText.innerHTML = waitingLines[attempt % waitingLines.length];
        await new Promise(r => setTimeout(r, 2500));
      }
    }
  }

  boot();
</script>
</body>
</html>
