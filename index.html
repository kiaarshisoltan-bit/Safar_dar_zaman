<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ماشین زمان کیا</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; font-family: Vazirmatn, Tahoma, sans-serif;
    background: radial-gradient(circle at 50% 20%, #1b2a5e 0%, #070b1c 60%, #000 100%);
    color: #eaf2ff; display: flex; align-items: center; justify-content: center;
    padding: 18px; overflow-x: hidden;
  }
  .card {
    width: 100%; max-width: 460px; background: rgba(16, 24, 48, .82);
    border: 1px solid rgba(120, 180, 255, .28); border-radius: 22px;
    padding: 22px 18px; backdrop-filter: blur(10px);
    box-shadow: 0 0 40px rgba(60, 130, 255, .22);
  }
  h1 { font-size: 22px; text-align: center; margin: 4px 0 6px; letter-spacing: .5px; }
  .sub { text-align: center; font-size: 13px; color: #9db4dd; margin-bottom: 18px; }
  button {
    width: 100%; padding: 14px; border: 0; border-radius: 14px; cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 700; color: #06101f;
    background: linear-gradient(135deg, #6fe3ff, #4a8cff);
    transition: transform .15s, filter .15s;
  }
  button:active { transform: scale(.97); }
  button:disabled { filter: grayscale(.6) brightness(.8); cursor: wait; }
  .ghost {
    background: transparent; color: #bcd4ff;
    border: 1px solid rgba(120, 180, 255, .35); margin-top: 10px;
  }
  .story-title { font-size: 17px; font-weight: 800; color: #8fd8ff; margin-bottom: 10px; }
  .story-text { font-size: 14.5px; line-height: 2; color: #dbe7ff; margin-bottom: 16px; }
  .choices button { margin-bottom: 9px; }
  .error {
    background: rgba(255, 80, 80, .12); border: 1px solid rgba(255, 90, 90, .45);
    color: #ffb3b3; font-size: 13px; line-height: 1.9; padding: 11px 13px;
    border-radius: 12px; margin-bottom: 12px; display: none;
  }
  .loader {
    height: 4px; border-radius: 4px; overflow: hidden;
    background: rgba(120, 180, 255, .18); margin-bottom: 14px; display: none;
  }
  .loader::after {
    content: ""; display: block; height: 100%; width: 40%;
    background: linear-gradient(90deg, transparent, #6fe3ff, transparent);
    animation: slide 1.1s infinite linear;
  }
  @keyframes slide { from { transform: translateX(120%); } to { transform: translateX(-260%); } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <h1>⏳ ماشین زمان کیا</h1>
  <div class="sub">پورتال زمان آماده‌ی سفر است</div>

  <div class="loader" id="loader"></div>
  <div class="error" id="error"></div>

  <div id="home">
    <button onclick="startGame()">شروع سفر</button>
  </div>

  <div id="game" class="hidden">
    <div class="story-title" id="storyTitle"></div>
    <div class="story-text" id="storyText"></div>
    <div class="choices" id="choices"></div>
    <button class="ghost" onclick="goHome()">بازگشت به پورتال</button>
  </div>
</div>

<script>
const BACKEND_URL = "https://safar-dar-zaman.onrender.com";
const loader = document.getElementById("loader");
const errorBox = document.getElementById("error");
let era = "past";

function showLoader(on) { loader.style.display = on ? "block" : "none"; }
function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = msg ? "block" : "none";
}

async function callApi(path, body, retries = 2) {
  for (let i = 0; i <= retries; i++) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 60000);
      const res = await fetch(BACKEND_URL + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
        signal: ctrl.signal,
      });
      clearTimeout(timer);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    } catch (e) {
      if (i === retries) throw e;
      showError("سرور در حال بیدار شدن است... تلاش دوباره (" + (i + 1) + ")");
      await new Promise(r => setTimeout(r, 3000));
    }
  }
}

async function startGame() {
  showError("");
  showLoader(true);
  try {
    await callApi("/api/start", {});
    era = "past";
    await loadStep();
  } catch (e) {
    showError("خطا در برقراری ارتباط با پورتال زمان! اتصال اینترنت یا سرور را بررسی کنید. (" + e.message + ")");
  } finally {
    showLoader(false);
  }
}

async function loadStep() {
  showError("");
  showLoader(true);
  try {
    const data = await callApi("/api/step", { era });
    document.getElementById("home").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");
    document.getElementById("storyTitle").textContent = data.title || "";
    document.getElementById("storyText").textContent = data.text || "";
    const box = document.getElementById("choices");
    box.innerHTML = "";
    (data.choices || []).forEach(c => {
      const b = document.createElement("button");
      b.textContent = c;
      b.onclick = () => { era = era === "past" ? "future" : "past"; loadStep(); };
      box.appendChild(b);
    });
  } catch (e) {
    showError("خطا در دریافت داستان! (" + e.message + ")");
  } finally {
    showLoader(false);
  }
}

function goHome() {
  document.getElementById("game").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
  showError("");
}
</script>
</body>
</html>
